<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bookings — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Bookings</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <!-- Search & Filter Controls Toolbar -->
      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <div class="admin-search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="admin-search-input" placeholder="Search by client name, email, or session title..." oninput="applyFilters()">
          </div>
          <select id="status-filter" class="admin-filter-select" onchange="applyFilters()">
            <option value="all">All Statuses</option>
            <option value="confirmed">Confirmed</option>
            <option value="attended">Attended</option>
            <option value="no_show">No-Show</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="admin-count-badge" id="count-badge">Loading bookings...</div>
      </div>

      <div class="table-scroll">
        <table class="admin-table" id="bookings-table">
          <thead><tr><th>Session</th><th>Client</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/modal.js"></script>
  <script>
    let rawBookings = [];

    async function loadBookings() {
      try {
        rawBookings = await AdminAPI.listBookings();
        applyFilters();
      } catch (err) {
        document.querySelector("#bookings-table tbody").innerHTML = `
          <tr><td colspan="4" style="text-align:center; padding:24px; color:var(--destructive);">
            Failed to load bookings. Please refresh.
          </td></tr>`;
      }
    }

    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase().trim();
      const statusFilter = document.getElementById("status-filter").value;

      const filtered = rawBookings.filter(b => {
        const matchQuery = !q || 
          (b.session && b.session.title && b.session.title.toLowerCase().includes(q)) ||
          (b.contact_name && b.contact_name.toLowerCase().includes(q)) ||
          (b.contact_email && b.contact_email.toLowerCase().includes(q));
        const matchStatus = statusFilter === "all" || b.status === statusFilter;
        return matchQuery && matchStatus;
      });

      document.getElementById("count-badge").textContent = `Showing ${filtered.length} of ${rawBookings.length} bookings`;
      renderTable(filtered);
    }

    function renderTable(bookings) {
      const tbody = document.querySelector("#bookings-table tbody");

      if (!bookings || bookings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:32px 16px; opacity:0.7;">
          <svg style="width:28px;height:28px;color:var(--sand);margin-bottom:8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
          <br><span class="mono">No matching bookings found</span>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = bookings
        .map((b) => {
          const actions =
            b.status === "confirmed"
              ? `
              <button class="btn btn-tiny btn-outline" data-attend="${b.id}">Mark Attended</button>
              <button class="btn btn-tiny btn-outline" data-noshow="${b.id}">No-Show</button>
              <button class="btn btn-tiny btn-destructive" data-cancel="${b.id}">Cancel</button>
            `
              : "";
          return `
          <tr>
            <td><strong>${escapeHtml(b.session ? b.session.title : 'Session')}</strong><br><span class="mono" style="font-size:12px;opacity:0.75;">${b.session && b.session.start_time ? new Date(b.session.start_time).toLocaleDateString() : ''}</span></td>
            <td><strong>${escapeHtml(b.contact_name || '')}</strong><br><span class="mono" style="font-size:12px;opacity:0.75;">${escapeHtml(b.contact_email || '')}</span></td>
            <td><span class="badge ${b.status}">${b.status}</span></td>
            <td>${actions}</td>
          </tr>
        `;
        })
        .join("");

      tbody.querySelectorAll("[data-attend]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          await AdminAPI.markAttendance(btn.dataset.attend, "attended");
          loadBookings();
        })
      );
      tbody.querySelectorAll("[data-noshow]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          await AdminAPI.markAttendance(btn.dataset.noshow, "no_show");
          loadBookings();
        })
      );
      tbody.querySelectorAll("[data-cancel]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          const ok = await EMWModal.confirm("The client will be notified by email.", { title: "Cancel this booking?", confirmLabel: "Cancel booking", danger: true });
          if (!ok) return;
          await AdminAPI.cancelBooking(btn.dataset.cancel);
          loadBookings();
        })
      );
    }

    (async () => {
      await requireAdmin();
      loadBookings();
    })();
  </script>
</body>
</html>
