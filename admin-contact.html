<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Inbox — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Contact Inbox</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <!-- Search & Filter Controls Toolbar -->
      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <div class="admin-search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="admin-search-input" placeholder="Search by name, email, or message text..." oninput="applyFilters()">
          </div>
          <select id="status-filter" class="admin-filter-select" onchange="applyFilters()">
            <option value="all">All Statuses</option>
            <option value="new">New</option>
            <option value="read">Read</option>
            <option value="replied">Replied</option>
          </select>
        </div>
        <div class="admin-count-badge" id="count-badge">Loading messages...</div>
      </div>

      <div class="dash-list" id="messages-list"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script>
    let rawMessages = [];

    async function loadMessages() {
      try {
        rawMessages = await AdminAPI.listContactMessages();
        applyFilters();
      } catch (err) {
        document.getElementById("messages-list").innerHTML = `
          <div class="empty-state">
            <h3>Couldn't load messages</h3>
          </div>`;
      }
    }

    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase().trim();
      const statusFilter = document.getElementById("status-filter").value;

      const filtered = rawMessages.filter(m => {
        const matchQuery = !q || 
          (m.name && m.name.toLowerCase().includes(q)) ||
          (m.email && m.email.toLowerCase().includes(q)) ||
          (m.message && m.message.toLowerCase().includes(q));
        const matchStatus = statusFilter === "all" || m.status === statusFilter;
        return matchQuery && matchStatus;
      });

      document.getElementById("count-badge").textContent = `Showing ${filtered.length} of ${rawMessages.length} messages`;
      renderList(filtered);
    }

    function renderList(messages) {
      const listEl = document.getElementById("messages-list");

      if (!messages || messages.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state" style="background:#fff; border:1px solid var(--sand); border-radius:8px; padding:32px; text-align:center;">
            <span class="mono" style="opacity:0.7;">No matching messages found</span>
          </div>`;
        return;
      }

      listEl.innerHTML = messages
        .map(
          (m) => `
        <div class="dash-row">
          <div>
            <h3>${escapeHtml(m.name)} <span class="mono" style="font-size:13px; font-weight:normal;">— ${escapeHtml(m.email)}</span></h3>
            <p style="margin:4px 0 8px; opacity:0.9; font-size:14px; line-height:1.5;">${escapeHtml(m.message)}</p>
            <p class="mono" style="font-size:11px; opacity:0.6; margin:0;">${new Date(m.created_at).toLocaleString()}</p>
          </div>
          <div style="text-align:right;min-width:130px;">
            <span class="badge ${m.status}">${m.status}</span>
            <br>
            ${
              m.status !== "read"
                ? `<button class="btn btn-tiny btn-outline" style="margin-top:8px;" data-mark="read" data-id="${m.id}">Mark Read</button>`
                : ""
            }
            ${
              m.status !== "replied"
                ? `<button class="btn btn-tiny btn-outline" style="margin-top:4px;" data-mark="replied" data-id="${m.id}">Mark Replied</button>`
                : ""
            }
          </div>
        </div>
      `
        )
        .join("");

      listEl.querySelectorAll("[data-mark]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          await AdminAPI.updateContactMessageStatus(btn.dataset.id, btn.dataset.mark);
          loadMessages();
        })
      );
    }

    (async () => {
      await requireAdmin();
      loadMessages();
    })();
  </script>
</body>
</html>
