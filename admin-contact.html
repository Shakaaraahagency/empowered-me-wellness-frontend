<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Inbox — Empowered Me Wellness</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/emw-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <script>
    if (!document.cookie.split(';').some(item => item.trim().startsWith('csrf_access_token='))) {
      window.location.href = "admin-login.html";
    }
  </script>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Contact Inbox</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <div class="dash-list" id="messages-list"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script>
    async function loadMessages() {
      const messages = await AdminAPI.listContactMessages();
      const listEl = document.getElementById("messages-list");

      if (messages.length === 0) {
        listEl.innerHTML = `<p class="mono" style="text-align:center;">No messages yet.</p>`;
        return;
      }

      listEl.innerHTML = messages
        .map(
          (m) => `
        <div class="dash-row">
          <div>
            <h3>${escapeHtml(m.name)} <span class="mono">— ${escapeHtml(m.email)}</span></h3>
            <p>${escapeHtml(m.message)}</p>
            <p class="mono">${new Date(m.created_at).toLocaleString()}</p>
          </div>
          <div style="text-align:right;min-width:130px;">
            <span class="badge ${m.status}">${m.status}</span>
            <br>
            ${
              m.status !== "read"
                ? `<button class="btn btn-tiny" style="margin-top:8px;" data-mark="read" data-id="${m.id}">Mark Read</button>`
                : ""
            }
            ${
              m.status !== "replied"
                ? `<button class="btn btn-tiny" data-mark="replied" data-id="${m.id}">Mark Replied</button>`
                : ""
            }
          </div>
        </div>
      `
        )
        .join("");

      listEl.querySelectorAll("[data-mark]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          await AdminAPI.updateContactMessageStatus(btn.dataset.id, btn.dataset.mark);
          loadMessages();
        })
      );
    }

    (async () => {
      await requireAdmin();
      loadMessages();
    })();
  </script>
</body>
</html>
