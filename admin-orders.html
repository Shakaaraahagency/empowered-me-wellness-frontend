<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Orders</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <!-- Search & Filter Controls Toolbar -->
      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <div class="admin-search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="admin-search-input" placeholder="Search by customer email or product name..." oninput="applyFilters()">
          </div>
          <select id="status-filter" class="admin-filter-select" onchange="applyFilters()">
            <option value="all">All Statuses</option>
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
            <option value="cancelled">Cancelled</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>
        <div class="admin-toolbar-actions">
          <button id="cleanup-btn" class="btn btn-secondary">Clean up stale orders</button>
          <div class="admin-count-badge" id="count-badge">Loading orders...</div>
        </div>
      </div>

      <div class="table-scroll">
        <table class="admin-table" id="orders-table">
          <thead><tr><th>Items</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/api.js"></script>
  <script>
    let rawOrders = [];

    async function loadOrders() {
      try {
        rawOrders = await AdminAPI.listOrders();
        applyFilters();
      } catch (err) {
        document.querySelector("#orders-table tbody").innerHTML = `<tr><td colspan="4" style="text-align:center; padding:24px 16px;"><span class="mono" style="opacity:0.7;">Couldn't load orders.</span></td></tr>`;
      }
    }

    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase().trim();
      const statusFilter = document.getElementById("status-filter").value;

      const filtered = rawOrders.filter(o => {
        const itemNames = (o.items || []).map(i => i.product_name || '').join(' ').toLowerCase();
        const matchQuery = !q || 
          (o.contact_email && o.contact_email.toLowerCase().includes(q)) ||
          itemNames.includes(q);
        const matchStatus = statusFilter === "all" || o.status === statusFilter;
        return matchQuery && matchStatus;
      });

      document.getElementById("count-badge").textContent = `Showing ${filtered.length} of ${rawOrders.length} orders`;
      renderTable(filtered);
    }

    function renderTable(orders) {
      const tbody = document.querySelector("#orders-table tbody");
      if (!orders || orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:32px 16px; opacity:0.7;">
          <span class="mono">No matching orders found</span>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = orders
        .map(
          (o) => `
        <tr>
          <td><strong>${o.items.map((i) => escapeHtml(i.product_name)).join(", ")}</strong></td>
          <td class="mono" style="font-size:13px;">${escapeHtml(o.contact_email)}</td>
          <td><strong>$${o.total_amount}</strong></td>
          <td><span class="badge ${o.status}">${o.status}</span></td>
        </tr>
      `
        )
        .join("");
    }

    (async () => {
      await requireAdmin();
      loadOrders();

      document.getElementById("cleanup-btn").addEventListener("click", async () => {
        const ok = await EMWModal.confirm(
          "This cancels orders that have sat unpaid for more than 24 hours (each is double-checked with Stripe first, so anything that actually got paid is left alone).",
          { title: "Clean up stale pending orders?", confirmLabel: "Clean up", danger: false }
        );
        if (!ok) return;

        const btn = document.getElementById("cleanup-btn");
        btn.disabled = true;
        const originalLabel = btn.textContent;
        btn.textContent = "Cleaning up…";

        try {
          const result = await AdminAPI.cleanupStaleOrders(24);
          await EMWModal.alert(
            result.cancelled_count === 0
              ? "Nothing to clean up — no stale pending orders found."
              : `Cancelled ${result.cancelled_count} stale pending order${result.cancelled_count === 1 ? "" : "s"}.`,
            { title: "Cleanup complete" }
          );
          loadOrders();
        } catch (err) {
          await EMWModal.alert(err.message || "Could not run cleanup.", { title: "Something went wrong" });
        } finally {
          btn.disabled = false;
          btn.textContent = originalLabel;
        }
      });
    })();
  </script>
</body>
</html>
