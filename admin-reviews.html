<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Reviews — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Product Reviews</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <div class="dash-list" id="reviews-list"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script>
    const renderStars = (rating) => "★".repeat(rating) + "☆".repeat(5 - rating);

    async function loadReviews() {
      const listEl = document.getElementById("reviews-list");
      try {
        const reviews = await AdminAPI.listReviews();
        if (!reviews || reviews.length === 0) {
          listEl.innerHTML = `<p class="mono" style="text-align:center;">No product reviews yet.</p>`;
          return;
        }

        listEl.innerHTML = reviews.map(r => `
          <div class="dash-row">
            <div>
              <div style="display:flex; align-items:baseline; gap:8px;">
                <h3>${escapeHtml(r.author_name)}</h3>
                <span style="color:#d4a017; font-size:12px;">${renderStars(r.rating)}</span>
              </div>
              <p class="mono" style="font-size:12px; opacity:0.6; margin-bottom:8px;">Product: ${escapeHtml(r.product_name)}</p>
              <p>${escapeHtml(r.content)}</p>
            </div>
            <div style="text-align:right;min-width:140px;">
              <span class="badge ${r.is_approved ? "approved" : ""}">${r.is_approved ? "approved" : "pending"}</span>
              <br>
              <button class="btn btn-tiny ${r.is_approved ? 'btn-outline' : ''}" style="margin-top:8px;" data-toggle-approve="${r.id}" data-current="${r.is_approved}">
                ${r.is_approved ? "Hide" : "Approve"}
              </button>
              <button class="btn btn-tiny" data-delete="${r.id}">Delete</button>
            </div>
          </div>
        `).join("");

        listEl.querySelectorAll("[data-toggle-approve]").forEach((btn) =>
          btn.addEventListener("click", async () => {
            const current = btn.dataset.current === "true";
            await AdminAPI.updateReview(btn.dataset.toggleApprove, { is_approved: !current });
            loadReviews();
          })
        );
        listEl.querySelectorAll("[data-delete]").forEach((btn) =>
          btn.addEventListener("click", async () => {
            if (!confirm("Delete this review permanently?")) return;
            await AdminAPI.deleteReview(btn.dataset.delete);
            loadReviews();
          })
        );
      } catch (err) {
        listEl.innerHTML = `<p class="error-msg">Failed to load reviews.</p>`;
      }
    }

    (async () => {
      await requireAdmin();
      loadReviews();
    })();
  </script>
</body>
</html>
