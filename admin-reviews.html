<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Reviews — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
  <style>
    .dash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    @media (max-width: 680px) {
      .dash-row {
        flex-direction: column;
        align-items: stretch;
      }
      .dash-row-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Product Reviews</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <!-- Search & Filter Controls Toolbar -->
      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <div class="admin-search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="admin-search-input" placeholder="Search by reviewer name, product name, or review content..." oninput="applyFilters()">
          </div>
          <select id="status-filter" class="admin-filter-select" onchange="applyFilters()">
            <option value="all">All Statuses</option>
            <option value="approved">Approved</option>
            <option value="pending">Pending</option>
          </select>
          <select id="rating-filter" class="admin-filter-select" onchange="applyFilters()">
            <option value="all">All Ratings</option>
            <option value="5">★★★★★ (5 Stars)</option>
            <option value="4">★★★★☆ (4 Stars)</option>
            <option value="3">★★★☆☆ (3 Stars)</option>
            <option value="2">★★☆☆☆ (2 Stars)</option>
            <option value="1">★☆☆☆☆ (1 Star)</option>
          </select>
        </div>
        <div class="admin-count-badge" id="count-badge">Loading reviews...</div>
      </div>

      <div class="dash-list" id="reviews-list"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/modal.js"></script>
  <script>
    let rawReviews = [];
    const renderStars = (rating) => "★".repeat(rating) + "☆".repeat(5 - rating);

    async function loadReviews() {
      try {
        rawReviews = await AdminAPI.listReviews();
        applyFilters();
      } catch (err) {
        document.getElementById("reviews-list").innerHTML = `
          <div class="alert alert-error">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <div>
              <p class="alert-title">Couldn't load reviews</p>
              <p class="alert-body">Please try again. <button type="button" class="btn-link" onclick="loadReviews()">Retry</button></p>
            </div>
          </div>`;
      }
    }

    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase().trim();
      const statusFilter = document.getElementById("status-filter").value;
      const ratingFilter = document.getElementById("rating-filter").value;

      const filtered = rawReviews.filter(r => {
        const matchQuery = !q || 
          (r.author_name && r.author_name.toLowerCase().includes(q)) ||
          (r.product_name && r.product_name.toLowerCase().includes(q)) ||
          (r.content && r.content.toLowerCase().includes(q));
        
        let matchStatus = true;
        if (statusFilter === "approved") matchStatus = r.is_approved === true;
        else if (statusFilter === "pending") matchStatus = !r.is_approved;

        const matchRating = ratingFilter === "all" || String(r.rating) === String(ratingFilter);

        return matchQuery && matchStatus && matchRating;
      });

      document.getElementById("count-badge").textContent = `Showing ${filtered.length} of ${rawReviews.length} reviews`;
      renderList(filtered);
    }

    function renderList(reviews) {
      const listEl = document.getElementById("reviews-list");

      if (!reviews || reviews.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state" style="background:#fff; border:1px solid var(--sand); border-radius:8px; padding:32px; text-align:center;">
            <span class="mono" style="opacity:0.7;">No matching reviews found</span>
          </div>`;
        return;
      }

      listEl.innerHTML = reviews.map(r => `
        <div class="dash-row">
          <div style="flex: 1; min-width: 240px;">
            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 6px;">
              <h3 style="margin: 0;">${escapeHtml(r.author_name)}</h3>
              <span style="color: #C08A34; font-size: 14px; letter-spacing: 1px;">${renderStars(r.rating)}</span>
              <span class="badge ${r.is_approved ? "approved" : "new"}">${r.is_approved ? "approved" : "pending"}</span>
            </div>
            <p class="mono" style="font-size: 12px; opacity: 0.7; margin: 0 0 8px;">Product: <strong>${escapeHtml(r.product_name || '')}</strong></p>
            <p style="margin: 0; line-height: 1.5; font-size: 15px;">${escapeHtml(r.content)}</p>
          </div>
          <div class="dash-row-actions" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
            <button class="btn btn-tiny ${r.is_approved ? 'btn-outline' : 'btn-secondary'}" data-toggle-approve="${r.id}" data-current="${r.is_approved}">
              ${r.is_approved ? "Hide" : "Approve"}
            </button>
            <button class="btn btn-tiny btn-destructive" data-delete="${r.id}">Delete</button>
          </div>
        </div>
      `).join("");

      listEl.querySelectorAll("[data-toggle-approve]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          const current = btn.dataset.current === "true";
          await AdminAPI.updateReview(btn.dataset.toggleApprove, { is_approved: !current });
          loadReviews();
        })
      );

      listEl.querySelectorAll("[data-delete]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          const ok = await EMWModal.confirm("This can't be undone.", { title: "Delete this review permanently?", confirmLabel: "Delete", danger: true });
          if (!ok) return;
          await AdminAPI.deleteReview(btn.dataset.delete);
          loadReviews();
        })
      );
    }

    (async () => {
      await requireAdmin();
      loadReviews();
    })();
  </script>
</body>
</html>
