<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Classes & Sessions — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Classes &amp; Sessions</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <div class="section-block">
        <h2>Classes Catalogue</h2>
        <div class="inline-form">
          <form id="class-form">
            <input type="text" id="class-name" placeholder="Class name (e.g. Kemetic Yoga for Beginners)" required>
            <input type="text" id="class-category" list="category-options" placeholder="Category (e.g. Kemetic Yoga)" required>
            <datalist id="category-options">
              <option value="Kemetic Yoga"></option>
              <option value="Kid's Yoga"></option>
              <option value="Workshops"></option>
            </datalist>
            <textarea id="class-description" placeholder="Description (optional)" rows="2" style="width:100%;padding:10px;border:1px solid var(--sand);border-radius:8px;margin-bottom:10px;"></textarea>
            <button type="submit" class="btn btn-small">Add Class</button>
            <p class="error-msg" id="class-error"></p>
          </form>
        </div>

        <!-- Class Filter Toolbar -->
        <div class="admin-toolbar">
          <div class="admin-toolbar-group">
            <div class="admin-search-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="class-search" class="admin-search-input" placeholder="Search classes by name or category..." oninput="applyClassFilters()">
            </div>
            <select id="class-status-filter" class="admin-filter-select" onchange="applyClassFilters()">
              <option value="all">All Statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <div class="admin-count-badge" id="class-count-badge">Loading...</div>
        </div>

        <div class="table-scroll">
          <table class="admin-table" id="classes-table">
            <thead><tr><th>Name</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="section-block" style="margin-top:50px;">
        <h2>Scheduled Sessions Calendar</h2>
        <div class="inline-form">
          <form id="session-form">
            <input type="text" id="session-title" placeholder="Session title" required>
            <select id="session-class" style="width:100%;padding:10px;border:1px solid var(--sand);border-radius:8px;margin-bottom:10px;">
              <option value="">No linked class (one-off event)</option>
            </select>
            <div class="inline-form-row">
              <input type="datetime-local" id="session-start" required>
              <input type="datetime-local" id="session-end" required>
            </div>
            <div class="inline-form-row">
              <input type="text" id="session-location" placeholder="Location" value="Studio">
              <input type="number" id="session-capacity" placeholder="Capacity" value="12" min="1">
            </div>

            <!-- Event Flyer / Image Upload -->
            <div id="image-upload-zone" style="border: 2px dashed var(--sand); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 14px; cursor: pointer; transition: all 0.25s ease; background: rgba(241,232,214,0.15);" onclick="document.getElementById('session-image-input').click()">
              <input type="file" id="session-image-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
              <div id="image-upload-content">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--clay)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:8px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <p class="mono" style="font-size:13px; margin:0; opacity:0.7;">Upload event flyer or image (optional)</p>
                <p class="mono" style="font-size:11px; margin:4px 0 0; opacity:0.5;">PNG, JPG, WEBP, GIF — max 5MB</p>
              </div>
              <div id="image-preview" style="display:none;">
                <img id="image-preview-img" src="" alt="Event flyer preview" style="max-width:200px; max-height:200px; border-radius:8px; object-fit:cover;">
                <p class="mono" style="font-size:12px; margin:8px 0 0; color:var(--moss);">Image uploaded</p>
              </div>
            </div>
            <input type="hidden" id="session-image-url">
            <p class="mono" id="image-upload-error" style="display:none; color:#c0392b; font-size:13px;"></p>

            <button type="submit" class="btn btn-small">Add Session</button>
            <p class="error-msg" id="session-error"></p>
          </form>
        </div>

        <!-- Session Filter Toolbar -->
        <div class="admin-toolbar">
          <div class="admin-toolbar-group">
            <div class="admin-search-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="session-search" class="admin-search-input" placeholder="Search sessions by title..." oninput="applySessionFilters()">
            </div>
            <select id="session-status-filter" class="admin-filter-select" onchange="applySessionFilters()">
              <option value="all">All Statuses</option>
              <option value="scheduled">Scheduled</option>
              <option value="closed">Closed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="admin-count-badge" id="session-count-badge">Loading...</div>
        </div>

        <div class="table-scroll">
          <table class="admin-table" id="sessions-table">
            <thead><tr><th>Image</th><th>Title</th><th>When</th><th>Spots</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/modal.js"></script>
  <script>
    let rawClasses = [];
    let rawSessions = [];

    function formatDateTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    async function loadClasses() {
      const select = document.getElementById("session-class");
      try {
        rawClasses = await AdminAPI.listClasses();
        applyClassFilters();
        select.innerHTML =
          `<option value="">No linked class (one-off event)</option>` +
          rawClasses.map((c) => `<option value="${c.id}">${c.name}</option>`).join("");
      } catch (err) {
        document.querySelector("#classes-table tbody").innerHTML = `<tr><td colspan="4" style="text-align:center; padding:24px 16px;"><span class="mono" style="opacity:0.7;">Couldn't load classes.</span></td></tr>`;
      }
    }

    function applyClassFilters() {
      const q = document.getElementById("class-search").value.toLowerCase().trim();
      const statusFilter = document.getElementById("class-status-filter").value;

      const filtered = rawClasses.filter(c => {
        const matchQuery = !q || (c.name && c.name.toLowerCase().includes(q)) || (c.category && c.category.toLowerCase().includes(q));
        const isActive = c.is_active !== false;
        const matchStatus = statusFilter === "all" || (statusFilter === "active" && isActive) || (statusFilter === "inactive" && !isActive);
        return matchQuery && matchStatus;
      });

      document.getElementById("class-count-badge").textContent = `Showing ${filtered.length} of ${rawClasses.length} classes`;
      renderClassesTable(filtered);
    }

    function renderClassesTable(classes) {
      const tbody = document.querySelector("#classes-table tbody");
      if (classes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:32px 16px; opacity:0.7;">
          <span class="mono">No matching classes found</span>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = classes.map(c => `
        <tr>
          <td><strong>${escapeHtml(c.name)}</strong></td>
          <td style="text-transform: capitalize;">${escapeHtml(c.category || "—")}</td>
          <td><span class="badge ${c.is_active === false ? "cancelled" : "approved"}">${c.is_active === false ? "inactive" : "active"}</span></td>
          <td>
            ${c.is_active === false
              ? `<button class="btn btn-tiny btn-outline" data-activate-class="${c.id}">Activate</button>`
              : `<button class="btn btn-tiny btn-destructive" data-deactivate-class="${c.id}">Deactivate</button>`
            }
          </td>
        </tr>
      `).join("");

      tbody.querySelectorAll("[data-deactivate-class]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const ok = await EMWModal.confirm("All scheduled sessions will be hidden.", { title: "Deactivate class?", confirmLabel: "Deactivate", danger: true });
          if (!ok) return;
          await AdminAPI.updateClass(btn.dataset.deactivateClass, { is_active: false });
          loadClasses();
        });
      });

      tbody.querySelectorAll("[data-activate-class]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await AdminAPI.updateClass(btn.dataset.activateClass, { is_active: true });
          loadClasses();
        });
      });
    }

    async function loadSessions() {
      try {
        rawSessions = await AdminAPI.listSessions();
        applySessionFilters();
      } catch (err) {
        document.querySelector("#sessions-table tbody").innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px 16px;"><span class="mono" style="opacity:0.7;">Couldn't load sessions.</span></td></tr>`;
      }
    }

    function applySessionFilters() {
      const q = document.getElementById("session-search").value.toLowerCase().trim();
      const statusFilter = document.getElementById("session-status-filter").value;

      const filtered = rawSessions.filter(s => {
        const matchQuery = !q || (s.title && s.title.toLowerCase().includes(q));
        const matchStatus = statusFilter === "all" || s.status === statusFilter;
        return matchQuery && matchStatus;
      });

      document.getElementById("session-count-badge").textContent = `Showing ${filtered.length} of ${rawSessions.length} sessions`;
      renderSessionsTable(filtered);
    }

    function renderSessionsTable(sessions) {
      const tbody = document.querySelector("#sessions-table tbody");
      if (sessions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:32px 16px; opacity:0.7;">
          <span class="mono">No matching sessions found</span>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = sessions.map(s => `
        <tr>
          <td>${s.image_url ? `<img src="${s.image_url}" alt="" style="width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--sand);">` : `<span class="mono" style="font-size:11px; opacity:0.4;">—</span>`}</td>
          <td><strong>${escapeHtml(s.title)}</strong></td>
          <td class="mono" style="font-size:13px;">${formatDateTime(s.start_time)}</td>
          <td>${s.spots_remaining}/${s.capacity}</td>
          <td><span class="badge ${s.status === "cancelled" ? "cancelled" : s.status === "closed" ? "new" : "approved"}">${s.status}</span></td>
          <td>${s.status === "scheduled" ? `<button class="btn btn-tiny btn-destructive" data-cancel-session="${s.id}">Cancel</button>` : ""}</td>
        </tr>
      `).join("");

      tbody.querySelectorAll("[data-cancel-session]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const ok = await EMWModal.confirm("Every confirmed booking will be cancelled.", { title: "Cancel this session?", confirmLabel: "Cancel session", danger: true });
          if (!ok) return;
          const result = await AdminAPI.cancelSession(btn.dataset.cancelSession);
          await EMWModal.alert(`Notified: ${result.notified.join(", ") || "no one"}`, { title: "Session cancelled" });
          loadSessions();
        });
      });
    }

    (async () => {
      await requireAdmin();
      loadClasses();
      loadSessions();

      document.getElementById("class-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("class-error");
        errorEl.style.display = "none";
        try {
          await AdminAPI.createClass({
            name: document.getElementById("class-name").value.trim(),
            category: document.getElementById("class-category").value.trim(),
            description: document.getElementById("class-description").value.trim(),
          });
          document.getElementById("class-form").reset();
          loadClasses();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
        }
      });

      // Session image upload handler
      const imageInput = document.getElementById("session-image-input");
      const uploadZone = document.getElementById("image-upload-zone");

      imageInput.addEventListener("change", async () => {
        const file = imageInput.files[0];
        if (!file) return;
        const errEl = document.getElementById("image-upload-error");
        errEl.style.display = "none";

        if (file.size > 5 * 1024 * 1024) {
          errEl.textContent = "Image must be under 5MB.";
          errEl.style.display = "block";
          return;
        }

        try {
          uploadZone.style.opacity = "0.5";
          uploadZone.style.pointerEvents = "none";
          const formData = new FormData();
          formData.append("file", file);
          const result = await AdminAPI.uploadSessionImage(formData);
          document.getElementById("session-image-url").value = result.url;
          document.getElementById("image-upload-content").style.display = "none";
          document.getElementById("image-preview").style.display = "block";
          document.getElementById("image-preview-img").src = result.url;
        } catch (err) {
          errEl.textContent = err.message || "Image upload failed.";
          errEl.style.display = "block";
        } finally {
          uploadZone.style.opacity = "1";
          uploadZone.style.pointerEvents = "auto";
        }
      });

      // Drag and drop
      uploadZone.addEventListener("dragover", (e) => { e.preventDefault(); uploadZone.style.borderColor = "var(--clay)"; });
      uploadZone.addEventListener("dragleave", () => { uploadZone.style.borderColor = "var(--sand)"; });
      uploadZone.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadZone.style.borderColor = "var(--sand)";
        if (e.dataTransfer.files.length) {
          imageInput.files = e.dataTransfer.files;
          imageInput.dispatchEvent(new Event("change"));
        }
      });

      document.getElementById("session-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("session-error");
        errorEl.style.display = "none";
        try {
          const classId = document.getElementById("session-class").value;
          const imageUrl = document.getElementById("session-image-url").value;
          await AdminAPI.createSession({
            title: document.getElementById("session-title").value.trim(),
            class_id: classId || null,
            start_time: document.getElementById("session-start").value,
            end_time: document.getElementById("session-end").value,
            location: document.getElementById("session-location").value.trim(),
            capacity: parseInt(document.getElementById("session-capacity").value, 10),
            image_url: imageUrl || null,
          });
          document.getElementById("session-form").reset();
          document.getElementById("session-image-url").value = "";
          document.getElementById("image-upload-content").style.display = "block";
          document.getElementById("image-preview").style.display = "none";
          loadSessions();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
        }
      });
    })();
  </script>
</body>
</html>
