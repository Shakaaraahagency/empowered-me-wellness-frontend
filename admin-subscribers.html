<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribers — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Newsletter Subscribers</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <!-- Search & Filter Controls Toolbar -->
      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <div class="admin-search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="admin-search-input" placeholder="Search by email address..." oninput="applyFilters()">
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:16px;">
          <div class="admin-count-badge" id="count-badge">Loading subscribers...</div>
          <a id="export-link" href="#" class="btn btn-small" style="white-space:nowrap;">Export CSV</a>
        </div>
      </div>

      <div class="table-scroll">
        <table class="admin-table" id="subscribers-table">
          <thead><tr><th>Email</th><th>Subscribed Date</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script>
    let rawSubs = [];

    async function loadSubscribers() {
      try {
        rawSubs = await AdminAPI.listSubscribers();
        applyFilters();
      } catch (err) {
        document.querySelector("#subscribers-table tbody").innerHTML = `<tr><td colspan="2" style="text-align:center; padding:24px 16px;"><span class="mono" style="opacity:0.7;">Couldn't load subscribers.</span></td></tr>`;
      }
    }

    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase().trim();

      const filtered = rawSubs.filter(s => {
        return !q || (s.email && s.email.toLowerCase().includes(q));
      });

      document.getElementById("count-badge").textContent = `Showing ${filtered.length} of ${rawSubs.length} subscribers`;
      renderTable(filtered);
    }

    function renderTable(subs) {
      const tbody = document.querySelector("#subscribers-table tbody");
      if (!subs || subs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding:32px 16px; opacity:0.7;">
          <span class="mono">No matching subscribers found</span>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = subs
        .map(
          (s) => `
        <tr>
          <td><strong>${escapeHtml(s.email)}</strong></td>
          <td class="mono" style="font-size:13px;">${new Date(s.subscribed_at).toLocaleDateString()}</td>
        </tr>
      `
        )
        .join("");
    }

    (async () => {
      await requireAdmin();
      document.getElementById("export-link").href = absoluteApiUrl("/api/v1/admin/subscribers/export");
      loadSubscribers();
    })();
  </script>
</body>
</html>
