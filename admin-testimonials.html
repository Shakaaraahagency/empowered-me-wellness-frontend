<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Testimonials</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <div class="inline-form">
        <form id="testimonial-form">
          <div class="inline-form-row">
            <input type="text" id="t-author" placeholder="Author name" required>
            <input type="text" id="t-role" placeholder="Role (e.g. Parent of two)">
          </div>
          <textarea id="t-content" placeholder="Testimonial text" rows="3" required style="width:100%;padding:10px;border:1px solid var(--sand);border-radius:8px;margin-bottom:10px;"></textarea>
          <button type="submit" class="btn btn-small">Add Testimonial</button>
          <p class="error-msg" id="t-error"></p>
        </form>
      </div>

      <!-- Search & Filter Controls Toolbar -->
      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <div class="admin-search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="admin-search-input" placeholder="Search by author name, role, or text content..." oninput="applyFilters()">
          </div>
          <select id="status-filter" class="admin-filter-select" onchange="applyFilters()">
            <option value="all">All Statuses</option>
            <option value="approved">Approved</option>
            <option value="pending">Pending</option>
          </select>
        </div>
        <div class="admin-count-badge" id="count-badge">Loading testimonials...</div>
      </div>

      <div class="dash-list" id="testimonials-list"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/modal.js"></script>
  <script>
    let rawTestimonials = [];

    async function loadTestimonials() {
      try {
        rawTestimonials = await AdminAPI.listTestimonials();
        applyFilters();
      } catch (err) {
        document.getElementById("testimonials-list").innerHTML = `
          <div class="empty-state">
            <h3>Couldn't load testimonials</h3>
          </div>`;
      }
    }

    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase().trim();
      const statusFilter = document.getElementById("status-filter").value;

      const filtered = rawTestimonials.filter(t => {
        const matchQuery = !q || 
          (t.author_name && t.author_name.toLowerCase().includes(q)) ||
          (t.role && t.role.toLowerCase().includes(q)) ||
          (t.content && t.content.toLowerCase().includes(q));
        
        let matchStatus = true;
        if (statusFilter === "approved") matchStatus = t.is_approved === true;
        else if (statusFilter === "pending") matchStatus = !t.is_approved;

        return matchQuery && matchStatus;
      });

      document.getElementById("count-badge").textContent = `Showing ${filtered.length} of ${rawTestimonials.length} testimonials`;
      renderList(filtered);
    }

    function renderList(testimonials) {
      const listEl = document.getElementById("testimonials-list");

      if (!testimonials || testimonials.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state" style="background:#fff; border:1px solid var(--sand); border-radius:8px; padding:32px; text-align:center;">
            <span class="mono" style="opacity:0.7;">No matching testimonials found</span>
          </div>`;
        return;
      }

      listEl.innerHTML = testimonials
        .map(
          (t) => `
        <div class="dash-row">
          <div>
            <h3>${escapeHtml(t.author_name)}${t.role ? ` — <span class="mono" style="font-size:13px; font-weight:normal;">${escapeHtml(t.role)}</span>` : ""}</h3>
            <p style="margin:4px 0 0; opacity:0.88; font-size:14px; line-height:1.5;">${escapeHtml(t.content)}</p>
          </div>
          <div style="text-align:right;min-width:140px;">
            <span class="badge ${t.is_approved ? "approved" : ""}">${t.is_approved ? "approved" : "pending"}</span>
            <br>
            <button class="btn btn-tiny btn-outline" style="margin-top:8px;" data-toggle-approve="${t.id}" data-current="${t.is_approved}">${t.is_approved ? "Hide" : "Approve"}</button>
            <button class="btn btn-tiny btn-destructive" data-delete="${t.id}">Delete</button>
          </div>
        </div>
      `
        )
        .join("");

      listEl.querySelectorAll("[data-toggle-approve]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          const current = btn.dataset.current === "true";
          await AdminAPI.updateTestimonial(btn.dataset.toggleApprove, { is_approved: !current });
          loadTestimonials();
        })
      );
      listEl.querySelectorAll("[data-delete]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          const ok = await EMWModal.confirm("This can't be undone.", { title: "Delete this testimonial permanently?", confirmLabel: "Delete", danger: true });
          if (!ok) return;
          await AdminAPI.deleteTestimonial(btn.dataset.delete);
          loadTestimonials();
        })
      );
    }

    (async () => {
      await requireAdmin();
      loadTestimonials();

      document.getElementById("testimonial-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("t-error");
        errorEl.style.display = "none";
        try {
          await AdminAPI.createTestimonial({
            author_name: document.getElementById("t-author").value.trim(),
            role: document.getElementById("t-role").value.trim(),
            content: document.getElementById("t-content").value.trim(),
          });
          document.getElementById("testimonial-form").reset();
          loadTestimonials();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
        }
      });
    })();
  </script>
</body>
</html>
