<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos — Empowered Me Wellness Admin</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
  <style>
    .yt-thumb {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--sand);
    }
    .yt-preview-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
      padding: 12px 16px;
      background: rgba(241,232,214,0.25);
      border: 1px solid var(--sand);
      border-radius: 10px;
    }
    .yt-preview-wrap img {
      width: 180px;
      height: 101px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--sand);
    }
    .yt-preview-wrap .yt-preview-info {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--moss);
    }
    .yt-preview-wrap .yt-preview-id {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
      font-family: var(--font-body);
    }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>Videos</h1></section>
    <div id="admin-nav"></div>

    <div class="admin-container">
      <div class="section-block">
        <h2 id="form-heading">Add New Video</h2>
        <div class="inline-form">
          <form id="video-form">
            <input type="hidden" id="video-id">

            <input type="text" id="video-title" placeholder="Video Title" required>
            <textarea id="video-description" placeholder="Short description of this video (optional)" rows="3" style="width:100%;padding:10px;border:1px solid var(--sand);border-radius:8px;margin-bottom:10px;"></textarea>

            <input type="url" id="video-youtube-url" placeholder="YouTube Link (e.g. https://www.youtube.com/watch?v=...)" required>

            <!-- YouTube Preview -->
            <div id="yt-preview" class="yt-preview-wrap" style="display:none;">
              <img id="yt-preview-img" src="" alt="YouTube preview">
              <div>
                <div class="yt-preview-id" id="yt-preview-title">Video detected</div>
                <div class="yt-preview-info">YouTube ID: <span id="yt-preview-id-text">—</span></div>
              </div>
            </div>

            <select id="video-category" style="width:100%;padding:10px;border:1px solid var(--sand);border-radius:8px;margin-bottom:14px;">
              <option value="general">General</option>
              <option value="healing">Healing</option>
              <option value="breathwork">Breathwork</option>
              <option value="yoga">Yoga</option>
              <option value="mindfulness">Mindfulness</option>
            </select>

            <button type="submit" class="btn btn-small">Save Video</button>
            <button type="button" id="cancel-edit" class="btn btn-small btn-outline" style="display:none;color:var(--ink);border-color:var(--ink);background:transparent;">Cancel Edit</button>
            <p class="error-msg" id="video-error"></p>
          </form>
        </div>
      </div>

      <div class="section-block" style="margin-top:50px;">
        <h2>All Videos</h2>

        <!-- Search & Filter Controls Toolbar -->
        <div class="admin-toolbar">
          <div class="admin-toolbar-group">
            <div class="admin-search-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="search-input" class="admin-search-input" placeholder="Search by video title or description..." oninput="applyFilters()">
            </div>
            <select id="status-filter" class="admin-filter-select" onchange="applyFilters()">
              <option value="all">All Statuses</option>
              <option value="published">Published</option>
              <option value="draft">Draft</option>
            </select>
            <select id="category-filter" class="admin-filter-select" onchange="applyFilters()">
              <option value="all">All Categories</option>
              <option value="healing">Healing</option>
              <option value="breathwork">Breathwork</option>
              <option value="yoga">Yoga</option>
              <option value="mindfulness">Mindfulness</option>
              <option value="general">General</option>
            </select>
          </div>
          <div class="admin-count-badge" id="count-badge">Loading videos...</div>
        </div>

        <div class="table-scroll">
          <table class="admin-table" id="videos-table">
            <thead><tr><th style="width:140px;">Thumbnail</th><th>Title</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="js/components/layout.js"></script>
  <script src="js/components/admin-nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/modal.js"></script>
  <script>
    /* ================================================================
       State
       ================================================================ */
    let rawVideos = [];
    let editingId = null;

    /* ================================================================
       YouTube ID extraction (client-side mirror)
       ================================================================ */
    function extractYouTubeId(url) {
      if (!url) return null;
      const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function ytThumb(ytId) {
      return `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`;
    }

    /* ================================================================
       Live YouTube URL preview
       ================================================================ */
    const ytUrlInput = document.getElementById("video-youtube-url");
    ytUrlInput.addEventListener("input", () => {
      const id = extractYouTubeId(ytUrlInput.value);
      const preview = document.getElementById("yt-preview");
      if (id) {
        document.getElementById("yt-preview-img").src = ytThumb(id);
        document.getElementById("yt-preview-id-text").textContent = id;
        preview.style.display = "flex";
      } else {
        preview.style.display = "none";
      }
    });

    /* ================================================================
       Reset form
       ================================================================ */
    function resetForm() {
      editingId = null;
      document.getElementById("form-heading").textContent = "Add New Video";
      document.getElementById("video-form").reset();
      document.getElementById("cancel-edit").style.display = "none";
      document.getElementById("yt-preview").style.display = "none";
    }

    /* ================================================================
       Load videos
       ================================================================ */
    async function loadVideos() {
      try {
        rawVideos = await AdminAPI.listVideos();
        applyFilters();
      } catch (err) {
        document.querySelector("#videos-table tbody").innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px 16px;"><span class="mono" style="opacity:0.7;">Couldn't load videos.</span></td></tr>`;
      }
    }

    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase().trim();
      const statusFilter = document.getElementById("status-filter").value;
      const categoryFilter = document.getElementById("category-filter").value;

      const filtered = rawVideos.filter(v => {
        const matchQuery = !q ||
          (v.title && v.title.toLowerCase().includes(q)) ||
          (v.description && v.description.toLowerCase().includes(q));
        const matchStatus = statusFilter === "all" || v.status === statusFilter;
        const matchCategory = categoryFilter === "all" || v.category === categoryFilter;
        return matchQuery && matchStatus && matchCategory;
      });

      document.getElementById("count-badge").textContent = `Showing ${filtered.length} of ${rawVideos.length} videos`;
      renderTable(filtered);
    }

    /* ================================================================
       Render videos table
       ================================================================ */
    function renderTable(videos) {
      const tbody = document.querySelector("#videos-table tbody");
      if (!videos || videos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:32px 16px; opacity:0.7;">
          <span class="mono">No matching videos found</span>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = videos
        .map(
          (v) => `
        <tr>
          <td><img class="yt-thumb" src="${ytThumb(escapeHtml(v.youtube_id))}" alt="${escapeHtml(v.title)} thumbnail"></td>
          <td><strong>${escapeHtml(v.title)}</strong></td>
          <td><span class="badge">${escapeHtml(v.category)}</span></td>
          <td><span class="badge ${v.status === "published" ? "approved" : ""}">${v.status}</span></td>
          <td>
            <button class="btn btn-tiny btn-outline" data-edit="${v.id}">Edit</button>
            <button class="btn btn-tiny btn-outline" data-toggle-publish="${v.id}" data-status="${v.status}">${v.status === "published" ? "Unpublish" : "Publish"}</button>
            <button class="btn btn-tiny btn-destructive" data-delete="${v.id}">Delete</button>
          </td>
        </tr>
      `
        )
        .join("");

      /* Edit button */
      tbody.querySelectorAll("[data-edit]").forEach((btn) =>
        btn.addEventListener("click", () => {
          const video = rawVideos.find((v) => String(v.id) === String(btn.dataset.edit));
          if (!video) return;
          editingId = video.id;
          document.getElementById("form-heading").textContent = `Editing: ${video.title}`;
          document.getElementById("video-title").value = video.title;
          document.getElementById("video-description").value = video.description || "";
          document.getElementById("video-youtube-url").value = video.youtube_url;
          document.getElementById("video-category").value = video.category;
          document.getElementById("cancel-edit").style.display = "inline-block";

          // Trigger preview
          ytUrlInput.dispatchEvent(new Event("input"));

          window.scrollTo({ top: 0, behavior: "smooth" });
        })
      );

      /* Publish / Unpublish */
      tbody.querySelectorAll("[data-toggle-publish]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          btnLoading(btn);
          const newStatus = btn.dataset.status === "published" ? "draft" : "published";
          await AdminAPI.updateVideo(btn.dataset.togglePublish, { status: newStatus });
          loadVideos();
        })
      );

      /* Delete */
      tbody.querySelectorAll("[data-delete]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          const ok = await EMWModal.confirm("This can't be undone.", { title: "Delete this video permanently?", confirmLabel: "Delete", danger: true });
          if (!ok) return;
          btnLoading(btn);
          await AdminAPI.deleteVideo(btn.dataset.delete);
          loadVideos();
        })
      );
    }

    /* ================================================================
       Bootstrap
       ================================================================ */
    (async () => {
      await requireAdmin();
      loadVideos();

      document.getElementById("cancel-edit").addEventListener("click", resetForm);

      /* ---- Form submission ---- */
      document.getElementById("video-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const errorEl = document.getElementById("video-error");
        errorEl.style.display = "none";
        btnLoading(submitBtn);

        const payload = {
          title: document.getElementById("video-title").value.trim(),
          description: document.getElementById("video-description").value.trim() || null,
          youtube_url: document.getElementById("video-youtube-url").value.trim(),
          category: document.getElementById("video-category").value,
        };

        if (!payload.title) {
          errorEl.textContent = "Title is required.";
          errorEl.style.display = "block";
          btnReset(submitBtn);
          return;
        }
        if (!payload.youtube_url) {
          errorEl.textContent = "YouTube URL is required.";
          errorEl.style.display = "block";
          btnReset(submitBtn);
          return;
        }
        if (!extractYouTubeId(payload.youtube_url)) {
          errorEl.textContent = "Could not detect a valid YouTube video from this URL.";
          errorEl.style.display = "block";
          btnReset(submitBtn);
          return;
        }

        try {
          if (editingId) {
            await AdminAPI.updateVideo(editingId, payload);
          } else {
            await AdminAPI.createVideo(payload);
          }
          btnSuccess(submitBtn, "✓ Saved");
          resetForm();
          loadVideos();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
          btnReset(submitBtn);
        }
      });
    })();
  </script>
</body>
</html>
