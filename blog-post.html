<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healing Library — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="container" style="max-width:680px;padding-top:56px;padding-bottom:60px;">
      <div id="post-content"><p class="mono">Loading…</p></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/api.js"></script>
  <script src="js/components/layout.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const contentEl = document.getElementById("post-content");

      if (!slug) {
        contentEl.innerHTML = `<p class="mono">No post specified.</p>`;
        return;
      }

      try {
        const post = await BlogAPI.get(slug);
        document.title = `${post.title} — Empowered Me Wellness`;

        const metaDesc = document.createElement("meta");
        metaDesc.name = "description";
        metaDesc.content = post.seo_description || post.excerpt || post.title;
        document.head.appendChild(metaDesc);

        const canonical = document.createElement("link");
        canonical.rel = "canonical";
        canonical.href = `https://empoweredmewellness.com/blog-post.html?slug=${post.slug}`;
        document.head.appendChild(canonical);

        contentEl.innerHTML = `
          ${post.cover_image_url ? `
            <div style="width:100%; height:340px; border-radius:16px; overflow:hidden; margin-bottom:32px; box-shadow:0 8px 24px rgba(36,28,19,0.08);">
              <img src="${post.cover_image_url}" alt="${escapeHtml(post.title)}" style="width:100%; height:100%; object-fit:cover; display:block;">
            </div>
          ` : ""}
          <h1 style="font-size:clamp(2.2rem, 4vw, 3.2rem); margin-bottom:12px;">${escapeHtml(post.title)}</h1>
          <p class="mono" style="margin-bottom:32px; opacity:0.75; font-size:14px;">${post.published_at ? new Date(post.published_at).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) : 'Draft'}</p>
          <div class="blog-body" style="font-size:1.1rem; line-height:1.8; color:var(--ink);">${post.content}</div>
          <p style="margin-top:50px;"><a href="blog.html" class="btn btn-small btn-outline" style="text-decoration:none;">&larr; Back to Journal</a></p>
        `;
      } catch (err) {
        contentEl.innerHTML = `<p class="mono">This post couldn't be found.</p><p><a href="blog.html">Back to Blog</a></p>`;
      }
    })();
  </script>
</body>
</html>
