<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="card">
      <h1>Reset your password</h1>
      <p class="mono">Enter your email and we'll send you a reset link.</p>
      <form id="forgot-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <button type="submit" class="btn">Send Reset Link</button>
      </form>
      <p class="mono" id="result-msg" style="display:none;margin-top:16px;"></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("result-msg");
      try {
        const result = await AuthAPI.forgotPassword(email);
        msg.textContent = result.message;
        msg.style.display = "block";
      } catch (err) {
        // Backend deliberately never distinguishes "email not found" from
        // "sent" — this branch only fires for real errors (rate limit, etc).
        msg.textContent = err.message;
        msg.style.display = "block";
      }
    });
  </script>
</body>
</html>
