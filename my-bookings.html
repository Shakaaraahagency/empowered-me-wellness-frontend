<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>My Bookings</h1></section>
    <div id="dashboard-nav"></div>

    <div class="dash-container">
      <div class="dash-list" id="bookings-list">
        <p class="mono" style="text-align:center;">Loading…</p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/dashboard-nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/modal.js"></script>
  <script>
    function formatDateTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    async function loadBookings() {
      const listEl = document.getElementById("bookings-list");
      try {
        const bookings = await BookingsAPI.mine();
        if (bookings.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <line x1="8" y1="3" x2="8" y2="7"/>
                <line x1="16" y1="3" x2="16" y2="7"/>
              </svg>
              <h3>No bookings yet</h3>
              <p>Once you book a class, it'll show up here with the date, time, and cancellation window.</p>
              <a href="schedule.html" class="btn">Browse the schedule</a>
            </div>`;
          return;
        }

        const now = new Date();
        listEl.innerHTML = bookings
          .map((b) => {
            const canCancel = b.status === "confirmed" && new Date(b.session.start_time) > now;
            return `
            <div class="dash-row">
              <div>
                <h3>${escapeHtml(b.session.title)}</h3>
                <p class="mono">${formatDateTime(b.session.start_time)} · ${b.session.location}</p>
              </div>
              <div style="text-align:right;">
                <span class="status-tag ${b.status === "cancelled" ? "cancelled" : ""}">${b.status}</span>
                ${canCancel ? `<br><button class="btn btn-small btn-danger" style="margin-top:8px;" data-booking-id="${b.id}">Cancel</button>` : ""}
              </div>
            </div>
          `;
          })
          .join("");

        listEl.querySelectorAll("[data-booking-id]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const ok = await EMWModal.confirm("This will cancel your booking and free up the spot for someone else.", {
              title: "Cancel this booking?",
              confirmLabel: "Cancel booking",
              danger: true,
            });
            if (!ok) return;
            try {
              await BookingsAPI.cancel(btn.dataset.bookingId);
              loadBookings();
            } catch (err) {
              await EMWModal.alert(err.message, { title: "Couldn't cancel booking" });
            }
          });
        });
      } catch (err) {
        listEl.innerHTML = `
          <div class="alert alert-error">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <div>
              <p class="alert-title">Couldn't load your bookings</p>
              <p class="alert-body">Check your connection and try again. <button type="button" class="btn-link" onclick="loadBookings()">Retry</button></p>
            </div>
          </div>`;
      }
    }

    (async () => {
      await requireAuth();
      loadBookings();
    })();
  </script>
</body>
</html>
