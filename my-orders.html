<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><h1>My Orders</h1></section>
    <div id="dashboard-nav"></div>

    <div class="dash-container">
      <div class="dash-list" id="orders-list">
        <p class="mono" style="text-align:center;">Loading…</p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/components/dashboard-nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/modal.js"></script>
  <script>
    async function handleDownload(orderId, productId, btn) {
      btn.textContent = "Preparing…";
      btn.disabled = true;
      try {
        const result = await OrdersAPI.downloadLink(orderId, productId);
        window.location.href = absoluteApiUrl(result.download_url);
      } catch (err) {
        await EMWModal.alert(err.message, { title: "Couldn't get your download" });
      } finally {
        btn.textContent = "Download";
        btn.disabled = false;
      }
    }

    async function loadOrders() {
      await requireAuth();
      const listEl = document.getElementById("orders-list");

      try {
        const orders = await OrdersAPI.mine();
        if (orders.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9V6a6 6 0 0 1 12 0v3"/>
                <rect x="3" y="9" width="18" height="12" rx="2"/>
              </svg>
              <h3>No orders yet</h3>
              <p>Ebooks and guides you purchase will show up here with a re-download link.</p>
              <a href="shop.html" class="btn">Visit the shop</a>
            </div>`;
          return;
        }

        listEl.innerHTML = orders
          .map(
            (o) => `
          <div class="dash-row">
            <div>
              <h3>${o.items.map((i) => escapeHtml(i.product_name)).join(", ")}</h3>
              <p class="mono">$${o.total_amount} · ${new Date(o.created_at).toLocaleDateString()}</p>
            </div>
            <div style="text-align:right;">
              <span class="status-tag ${o.status === "paid" ? "paid" : ""}">${o.status}</span>
              ${
                o.status === "paid"
                  ? o.items
                      .map(
                        (i) =>
                          `<br><button class="btn btn-small" style="margin-top:8px;" data-order-id="${o.id}" data-product-id="${i.product_id}">Download</button>`
                      )
                      .join("")
                  : ""
              }
            </div>
          </div>
        `
          )
          .join("");

        listEl.querySelectorAll("[data-order-id]").forEach((btn) => {
          btn.addEventListener("click", () => handleDownload(btn.dataset.orderId, btn.dataset.productId, btn));
        });
      } catch (err) {
        listEl.innerHTML = `
          <div class="alert alert-error">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <div>
              <p class="alert-title">Couldn't load your orders</p>
              <p class="alert-body">Check your connection and try again. <button type="button" class="btn-link" onclick="this.textContent='Retrying…'; this.disabled=true; setTimeout(loadOrders, 350);">Retry</button></p>
            </div>
          </div>`;
      }
    }

    loadOrders();
  </script>
</body>
</html>
