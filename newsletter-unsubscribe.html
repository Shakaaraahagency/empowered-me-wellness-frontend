<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="card" style="text-align:center;">
      <div id="unsub-content"><p class="mono">Processing…</p></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/api.js"></script>
  <script src="js/components/layout.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const email = params.get("email");
      const contentEl = document.getElementById("unsub-content");

      if (!email) {
        contentEl.innerHTML = `<h1>Missing email</h1><p class="mono">This link is missing an email address.</p>`;
        return;
      }

      try {
        await NewsletterAPI.unsubscribe(email);
        contentEl.innerHTML = `
          <h1>You're unsubscribed</h1>
          <p class="mono">${email} won't receive any more newsletter emails from us.</p>
          <a href="index.html" class="btn" style="margin-top:20px;display:inline-block;width:auto;">Back to Home</a>
        `;
      } catch (err) {
        contentEl.innerHTML = `<p class="mono">${err.message}</p>`;
      }
    })();
  </script>
</body>
</html>
