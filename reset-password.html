<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a New Password — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="card">
      <h1>Set a new password</h1>
      <form id="reset-form">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="8">
        <button type="submit" class="btn">Update Password</button>
        <p class="error-msg" id="error-msg"></p>
      </form>
      <p class="mono" id="success-msg" style="display:none;color:var(--moss);margin-top:16px;"></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.querySelector(".card").innerHTML = `
        <h1>Invalid link</h1>
        <p class="mono">This reset link is missing its token. Request a new one from the <a href="forgot-password.html">forgot password</a> page.</p>
      `;
    } else {
      document.getElementById("reset-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorMsg = document.getElementById("error-msg");
        const successMsg = document.getElementById("success-msg");
        errorMsg.style.display = "none";

        const password = document.getElementById("password").value;

        try {
          await AuthAPI.resetPassword(token, password);
          document.getElementById("reset-form").style.display = "none";
          successMsg.textContent = "Password updated! Redirecting to login…";
          successMsg.style.display = "block";
          setTimeout(() => (window.location.href = "/login"), 1500);
        } catch (err) {
          errorMsg.textContent = err.message;
          errorMsg.style.display = "block";
        }
      });
    }
  </script>
</body>
</html>
