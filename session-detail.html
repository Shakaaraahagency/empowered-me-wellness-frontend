<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Details — Empowered Me Wellness</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/polish.css">
  <style>
    .detail-wrap { max-width: 900px; margin: 0 auto; }
    .booking-card { background: #fff; border: 1px solid var(--sand); border-radius: 14px; padding: 28px; margin-top: 32px; }
    .full-banner { background: var(--clay); color: var(--papyrus); padding: 14px 18px; border-radius: 10px; text-align: center; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="container detail-wrap" style="padding-top:48px;">
      <div id="session-info">
        <p class="mono">Loading…</p>
      </div>

      <div class="booking-card" id="booking-card" style="display:none;">
        <h2 id="booking-heading">Book this session</h2>
        <div id="guest-fields">
          <label for="guest_name">Name</label>
          <input type="text" id="guest_name">
          <label for="guest_email">Email</label>
          <input type="email" id="guest_email">
          <label for="guest_phone">Phone (optional)</label>
          <input type="tel" id="guest_phone">
        </div>
        <p class="mono" id="logged-in-note" style="display:none;">Booking as <strong id="logged-in-email"></strong></p>
        <button id="book-btn" class="btn">Book This Session</button>
        <p class="error-msg" id="error-msg"></p>
      </div>

      <div class="full-banner" id="full-banner" style="display:none;">
        This session is fully booked. Check the <a href="schedule.html" style="color:var(--papyrus);">schedule</a> for other times.
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/components/layout.js"></script>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("id");

    function formatDateTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, {
        weekday: "long", month: "long", day: "numeric",
        hour: "numeric", minute: "2-digit",
      });
    }

    let currentUser = null;

    async function init() {
      const infoEl = document.getElementById("session-info");

      if (!sessionId) {
        infoEl.innerHTML = `<p class="mono">No session specified.</p>`;
        return;
      }

      let session;
      try {
        session = await SessionsAPI.get(sessionId);
      } catch (err) {
        infoEl.innerHTML = `<p class="mono">Session not found.</p>`;
        return;
      }

      infoEl.innerHTML = `
        <div style="display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap; margin-bottom:24px;">
          ${session.image_url ? `
            <div style="width: 320px; max-width: 100%; flex-shrink: 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--sand); box-shadow: 0 8px 24px rgba(36,28,19,0.08);">
              <img src="${session.image_url}" alt="${escapeHtml(session.title)}" style="width: 100%; height: auto; display: block; object-fit: cover;">
            </div>
          ` : ""}
          <div style="flex: 1; min-width: 280px;">
            <div class="section-badge" style="letter-spacing:0.1em; margin-bottom:8px;">${session.class_category || 'EVENT & SESSION'}</div>
            <h1 style="margin:0 0 12px; font-size:clamp(2rem, 4vw, 2.8rem);">${escapeHtml(session.title)}</h1>
            <div style="font-size:1.5rem; font-weight:700; color:var(--clay); margin-bottom:16px; font-family:var(--font-mono);">
              ${session.price ? `$${parseFloat(session.price).toFixed(2)}` : '<span style="color:var(--moss);">Free Session</span>'}
            </div>
            <p class="mono" style="font-size:14px; opacity:0.85; margin-bottom:16px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              ${formatDateTime(session.start_time)} &middot; ${escapeHtml(session.location)}
            </p>
            ${session.description ? `<p style="font-size:1.05rem; line-height:1.65; color:var(--ink); opacity:0.9; margin-bottom:20px;">${escapeHtml(session.description)}</p>` : ""}
            <div style="display:inline-flex; align-items:center; gap:8px; background:rgba(241,232,214,0.5); border:1px solid var(--sand); padding:8px 16px; border-radius:20px; font-family:var(--font-mono); font-size:13px;">
              <span style="width:8px; height:8px; border-radius:50%; background:${session.is_full ? '#c0392b' : 'var(--moss)'};"></span>
              <span>${session.spots_remaining} of ${session.capacity} spots remaining</span>
            </div>
          </div>
        </div>
      `;

      document.title = `${session.title} — Empowered Me Wellness`;
      const metaDesc = document.createElement("meta");
      metaDesc.name = "description";
      metaDesc.content = session.description || `Book ${session.title} at Empowered Me Wellness.`;
      document.head.appendChild(metaDesc);

      if (session.is_full) {
        document.getElementById("full-banner").style.display = "block";
        return;
      }

      document.getElementById("booking-card").style.display = "block";

      try {
        currentUser = await AuthAPI.me();
        document.getElementById("guest-fields").style.display = "none";
        document.getElementById("logged-in-note").style.display = "block";
        document.getElementById("logged-in-email").textContent = currentUser.email;
      } catch (err) {
        // Not logged in — guest fields stay visible, that's fine.
      }

      if (session.price && parseFloat(session.price) > 0) {
        const priceStr = parseFloat(session.price).toFixed(2);
        document.getElementById("book-btn").textContent = `Proceed to Payment ($${priceStr})`;
      }

      document.getElementById("book-btn").addEventListener("click", async () => {
        const errorMsg = document.getElementById("error-msg");
        errorMsg.style.display = "none";

        const origin = window.location.origin;
        const payload = {
          session_id: sessionId,
          success_url: `${origin}/booking-confirmation.html`,
          cancel_url: `${origin}/session-detail.html?id=${sessionId}`,
        };

        if (!currentUser) {
          payload.guest_name = document.getElementById("guest_name").value.trim();
          payload.guest_email = document.getElementById("guest_email").value.trim();
          payload.guest_phone = document.getElementById("guest_phone").value.trim();
        }

        try {
          const res = await BookingsAPI.create(payload);
          const bookingData = res.booking || res;
          sessionStorage.setItem("emw_last_booking", JSON.stringify(bookingData));

          if (res.checkout_url && res.checkout_url.includes("checkout.stripe.com")) {
            window.location.href = res.checkout_url;
          } else {
            window.location.href = `booking-confirmation.html?id=${bookingData.id}`;
          }
        } catch (err) {
          errorMsg.textContent = err.message;
          errorMsg.style.display = "block";
        }
      });
    }

    init();
  </script>
</body>
</html>
